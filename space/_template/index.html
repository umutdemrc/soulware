<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Partner space — Soulware</title>
  <meta name="theme-color" content="#F8F6F1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232C3333'/%3E%3Cstop offset='1' stop-color='%238BA888'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-family='Inter,sans-serif' font-size='18' font-weight='600' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="stylesheet" href="../space.css" />

  <!--
    One private space per influencer. Create with tools/new_page.py space ...
    The partner's step, test page and plan come LIVE from the "partners" tab of the
    "Soulware Waitlists" sheet (status → step: Verify/Contacted/Call booked = 1 Call,
    Test = 2, Sign = 3, Signed/Building/Live = 4 Launch). Change the sheet, not this file.
    The values below are only the fallback if the sheet can't be reached.
  -->
  <script>
    window.SPACE = {
      id: "template",
      lang: "en",
      partner: "[Partner name]",
      stage: 1,
      testSlug: "",
      bookingUrl: "PASTE_BOOKING_URL_HERE",
      plan: { idea: "", delivery: "", content: "", launch: "", ongoing: "", link: "", review: "" },
      signed: "",
      termsUpdated: "Last updated: 17 November 2026",
      termsFinal: false,
      endpoint: "PASTE_APPS_SCRIPT_WEB_APP_URL_HERE"
    };
    if (window.SPACE.testSlug) document.write('<script src="../../w/' + window.SPACE.testSlug + '/config.js"><\/script>');
  </script>
</head>
<body>
  <header class="sp-top">
    <div class="container sp-wrap">
      <a class="swmark" href="../../partners/" aria-label="Soulware">
        <svg class="swmark__glyph" viewBox="0 0 36 36" width="30" height="30"><defs><linearGradient id="sw-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2C3333"/><stop offset="1" stop-color="#8BA888"/></linearGradient></defs><rect width="36" height="36" rx="11" fill="url(#sw-grad)"/><text x="18" y="25" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">S</text></svg>
        <span class="swmark__name">Soulware</span>
      </a>
      <div class="sp-top__meta"><b id="spFor"></b><span id="spContact"></span></div>
    </div>
  </header>

  <main class="container sp-wrap">
    <div class="sp-hello" id="spHello"></div>
    <ol class="sp-tracker" id="spTracker"></ol>
    <nav class="sp-tabs" id="spTabs"></nav>
    <div id="spView"></div>
  </main>

  <footer class="sp-foot" id="spFooter"></footer>

  <script src="../terms.js"></script>
  <script src="../space.js"></script>
</body>
</html>
